{% extends 'registrations/base.html' %}
{% block title %}Registration Successful{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow p-8">
  <h1 class="text-2xl font-bold mb-2">You're in! 🎉</h1>
  <p class="text-gray-700">Thanks, <strong>{{ runner.first_name }}</strong>. Your spot for <strong>{{ race.name }}</strong> is saved.</p>
  <a href="/" class="inline-block mt-4 px-4 py-2 rounded-xl bg-blue-600 text-white">Back to Home</a>
</div>
{% endblock %}
